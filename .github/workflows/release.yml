name: Release Windows exe

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm may skip Electron's postinstall download; electronDist needs it.
      - run: node node_modules/electron/install.js
      - name: Build exe
        shell: bash
        run: npm run dist 2>&1 | tee dist.log; exit ${PIPESTATUS[0]}
      # Logs need a sign-in; annotations don't, so surface the failure there.
      - name: Report build failure
        if: failure()
        shell: bash
        run: echo "::error title=dist failed::$(tail -40 dist.log | tr -d '\r' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/InfiniShoot.exe
          generate_release_notes: true
